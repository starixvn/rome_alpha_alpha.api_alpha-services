syntax = "proto3";

option csharp_namespace = "GrpcReports";

package Reports;

service Reports {
  rpc GetOutstandingReport (GetOutstandingReportRequest) returns (GetOutstandingReportResponse);
}

message GetOutstandingReportRequest {
  string language = 1;
  int32 custId = 2;
  string custName = 3;
  string site = 4;
  int32 currencyId = 5;
  sint32 custLevelId = 6;
  int32 viewerId = 7;
  sint32 viewerLevelId = 8;
  bool autoFollowBetIsDummyAgent = 9;

  string sortPropertyName = 10;
  bool isDescendingSort = 11;
} 

message GetOutstandingReportResponse {
  repeated OutstandingModel report = 1;
  int32 custId = 2;
}

message OutstandingModel {
  int32 custId = 1;
  string custName = 2;
  float memberOutstanding = 3;
  float agentOutstanding = 4;
  float superOutstanding = 5;
  float masterOutstanding = 6;
}
