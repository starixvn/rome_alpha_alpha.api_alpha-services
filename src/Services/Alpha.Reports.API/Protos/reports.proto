syntax = "proto3";

option csharp_namespace = "GrpcReports";

package Reports;

service Reports {
  rpc GetSuperOutstanding(GetOutstandingReportRequest) returns (GetSuperOutstandingResponse);
  rpc GetSuperOnMasterOutstanding(GetOutstandingReportRequest) returns (GetSuperOnMasterOutstandingResponse);
  rpc GetSuperOnAgentOutstanding(GetOutstandingReportRequest) returns (GetSuperOnAgentOutstandingResponse);

  rpc GetMasterOutstanding(GetOutstandingReportRequest) returns (GetMasterOutstandingResponse);
  rpc GetMasterOnAgentOutstanding(GetOutstandingReportRequest) returns (GetMasterOnAgentOutstandingResponse);

  rpc GetAgentOutstanding(GetOutstandingReportRequest) returns (GetAgentOutstandingResponse);

  rpc GetSuperWinLossDetail(GetWinLossDetailReportRequest) returns (GetSuperWinLossDetailResponse);
  rpc GetMasterWinLossDetail(GetWinLossDetailReportRequest) returns (GetMasterWinLossDetailResponse);
  rpc GetAgentWinLossDetail(GetWinLossDetailReportRequest) returns (GetAgentWinLossDetailResponse);
}

message GetOutstandingReportRequest {
  int32 custId = 1;
  string custName = 2;
  string site = 3;
  int32 currencyId = 4;
  sint32 custLevelId = 5;
  int32 viewerId = 6;
  sint32 viewerLevelId = 7;
  bool autoFollowBetIsDummyAgent = 8;

  string sortPropertyName = 9;
  bool isDescendingSort = 10;
  string productGroup = 11;
  string productIds = 12;
}

message GetSuperOutstandingResponse {
  repeated SuperOutstandingModel report = 1;
  SuperOutstandingModel total = 2;
}

message GetSuperOnMasterOutstandingResponse {
  repeated SuperOnMasterOutstandingModel report = 1;
  SuperOnMasterOutstandingModel total = 2;
}

message GetSuperOnAgentOutstandingResponse {
  repeated SuperOnAgentOutstandingModel report = 1;
  SuperOnAgentOutstandingModel total = 2;
}

message GetMasterOutstandingResponse {
  repeated MasterOutstandingModel report = 1;
  MasterOutstandingModel total = 2;
}

message GetMasterOnAgentOutstandingResponse {
  repeated MasterOnAgentOutstandingModel report = 1;
  MasterOnAgentOutstandingModel total = 2;
}

message GetAgentOutstandingResponse {
  repeated AgentOutstandingModel report = 1;
  AgentOutstandingModel total = 2;
}

message SuperOutstandingModel {
  string custName = 1;
  string memberOutstanding = 2;
  string superOutstanding = 3;
}

message SuperOnMasterOutstandingModel {
  string custName = 1;
  string memberOutstanding = 2;
  string masterOutstanding = 3;
  string superOutstanding = 4;
}

message SuperOnAgentOutstandingModel {
  string custName = 1;
  string memberOutstanding = 2;
  string agentOutstanding = 3;
  string masterOutstanding = 4;
  string superOutstanding = 5;
}

message MasterOutstandingModel {
  string custName = 1;
  string memberOutstanding = 2;
  string masterOutstanding = 3;
}

message MasterOnAgentOutstandingModel {
  string custName = 1;
  string memberOutstanding = 2;
  string agentOutstanding = 3;
  string masterOutstanding = 4;
}

message AgentOutstandingModel {
  string custName = 1;
  string memberOutstanding = 2;
  string agentOutstanding = 3;
}

message GetWinLossDetailReportRequest {
  int32 custId = 1;
  string custName = 2;
  string site = 3;
  int32 currencyId = 4;
  sint32 custLevelId = 5;
  int32 viewerId = 6;
  sint32 viewerLevelId = 7;

  string sortPropertyName = 8;
  bool isDescendingSort = 9;
  string fromDate = 10;
  string toDate = 11;
  string productGroup = 12;
  string productIds = 13;
}

message GetSuperWinLossDetailResponse {
  repeated SuperWinLossDetailModel report = 1;
  SuperWinLossDetailModel total = 2;
}

message GetMasterWinLossDetailResponse {
  repeated MasterWinLossDetailModel report = 1;
  MasterWinLossDetailModel total = 2;
}

message GetAgentWinLossDetailResponse {
  repeated AgentWinLossDetailModel report = 1;
  AgentWinLossDetailModel total = 2;
}

message SuperWinLossDetailModel {
  string custName = 1;
  int32 betCount = 2;
  string turnover = 3;
  string netTurnover = 4;
  string grossComm = 5;
  string rewardAmount = 6;
  string rewardCurrency = 7;

  string memberWinLoss = 8;
  string memberComm = 9;
  string memberTotal = 10;

  string agentWinLoss = 11;
  string agentComm = 12;
  string agentTotal = 13;

  string masterWinLoss = 14;
  string masterComm = 15;
  string masterTotal = 16;

  string superWinLoss = 17;
  string superComm = 18;
  string superTotal = 19;

  string company = 20;

}

message MasterWinLossDetailModel {
  string custName = 1;
  int32 betCount = 2;
  string turnover = 3;
  string netTurnover = 4;
  string grossComm = 5;
  string rewardAmount = 6;
  string rewardCurrency = 7;

  string memberWinLoss = 8;
  string memberComm = 9;
  string memberTotal = 10;

  string agentWinLoss = 11;
  string agentComm = 12;
  string agentTotal = 13;

  string masterWinLoss = 14;
  string masterComm = 15;
  string masterTotal = 16;

  string company = 17;
}


message AgentWinLossDetailModel {
  string custName = 1;
  int32 betCount = 2;
  string turnover = 3;
  string netTurnover = 4;
  string grossComm = 5;
  string rewardAmount = 6;
  string rewardCurrency = 7;

  string memberWinLoss = 8;
  string memberComm = 9;
  string memberTotal = 10;

  string agentWinLoss = 11;
  string agentComm = 12;
  string agentTotal = 13;

  string company = 14;
}
