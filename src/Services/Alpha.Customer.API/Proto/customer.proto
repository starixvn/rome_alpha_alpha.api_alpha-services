syntax = "proto3";

option csharp_namespace = "GrpcCustomer";

package Customer;

service Customer {
    rpc GetCustomerStatus(GetCustomerStatusRequest) returns (GetCustomerStatusResponse) {}
    rpc GetCustomerInfo(GetCustomerInfoRequest) returns (GetCustomerInfoResponse) {}
    rpc GetDownlineInfo(GetDownlineInfoRequest) returns (GetDownlineInfoResponse) {}
    rpc GetBelongingInfo(GetBeLongingInfoRequest) returns (GetBeLongingInfoResponse) {}
    rpc GetAllProducts(GetAllProductsRequest) returns (GetAllProductsResponse) {}
    rpc ClearProductsCache(ClearProductsCacheRequest) returns (ClearProductsCacheResponse) {}
}

message GetCustomerStatusRequest {
    int32 custId = 1;
    int32 subAccId = 2;
}

message GetCustomerStatusResponse {
    int32 custId = 1;
    int32 subAccId = 2;
    bool isActive = 3;
    bool isProtectedMode = 4;
    bool isLocked = 5;
    bool IsSubAcc = 6;
    bool HasReportPermission = 7;
    bool HasMemberInformationPermission = 8;
}

message GetCustomerInfoRequest {
    int32 custId = 1;
    string username = 2;
}

message GetCustomerInfoResponse {
    int32 custId = 1;
    int32 roleId = 2;
    string site = 3;
    int32 currency = 4;
}

message GetDownlineInfoRequest {
    int32 viewerId = 1;
    string downlineUsername = 2;
}

message GetDownlineInfoResponse {
    bool isBelonging = 1;
}

message GetBeLongingInfoRequest {
    int32 viewerId = 1;
    int32 downlineId = 2;
    int32 subAccountId = 3;
    int64 transId = 4;
}

message GetBeLongingInfoResponse {
    bool isBelonging = 1;
}

message GetAllProductsRequest {
  int32 custId = 1;
  string siteName = 2;
  int32 currency = 3;
}

message GetAllProductsResponse {
  repeated ProductModel products = 1;
}

message ProductModel {
    int32 id = 1;
    string code = 2;
    string name = 3;
}

message ClearProductsCacheRequest {
    int32 custId = 1;
    string siteName = 2;
    int32 currency = 3;
}

message ClearProductsCacheResponse {
    bool result = 1;
}
