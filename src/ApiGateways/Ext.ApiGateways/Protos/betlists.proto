syntax = "proto3";

option csharp_namespace = "GrpcBetLists";

package BetLists;

service BetLists {
  rpc SuperViewRunningBetList(GetRunningBetListRequest) returns (SuperViewRunningBetListResponse);
  rpc MasterViewRunningBetList(GetRunningBetListRequest) returns (MasterViewRunningBetListResponse);
  rpc AgentViewRunningBetList(GetRunningBetListRequest) returns (AgentViewRunningBetListResponse);

  rpc SuperViewWinLossBetList(GetWinLossBetListRequest) returns (SuperViewWinLossBetListResponse);
  rpc MasterViewWinLossBetList(GetWinLossBetListRequest) returns (MasterViewWinLossBetListResponse);
  rpc AgentViewWinLossBetList(GetWinLossBetListRequest) returns (AgentViewWinLossBetListResponse);

  rpc SuperViewTicketDetails(GetTicketDetailsRequest) returns (SuperViewTicketDetailsResponse);
  rpc MasterViewTicketDetails(GetTicketDetailsRequest) returns (MasterViewTicketDetailsResponse);
  rpc AgentViewTicketDetails(GetTicketDetailsRequest) returns (AgentViewTicketDetailsResponse);
  
  rpc ParlaySelections(GetParlaySelectionsRequest) returns (ParlaySelectionsResponse);
  rpc ParlayDetail(GetParlayDetailRequest) returns (ParlayDetailResponse);
}

message GetRunningBetListRequest {
  string productGroup = 1;
  int32 custId = 2;
  string custName = 3;
  string site = 4;
  int32 viewerId = 5;
  string productIds = 6;
} 

message SuperViewRunningBetListResponse {
  repeated SuperViewRunningBetTicketModel betLists = 1;
}

message MasterViewRunningBetListResponse {
  repeated MasterViewRunningBetTicketModel betLists = 1;
}

message AgentViewRunningBetListResponse {
  repeated AgentViewRunningBetTicketModel betLists = 1;
}

message SuperViewRunningBetTicketModel {
  string no = 1;
  string transTime = 2;
  string choice = 3;
  string odds = 4;
  string stake = 5;
  string status = 6;
  string superPT_Comm = 7;
  string masterPT_Comm = 8;
  string agentPT_Comm = 9;
  ExtraInfoModel extraInfo = 10;
  string platform = 11;
  string detailKey = 12;
}

message MasterViewRunningBetTicketModel {
  string no = 1;
  string transTime = 2;
  string choice = 3;
  string odds = 4;
  string stake = 5;
  string status = 6;
  string masterPT_Comm = 7;
  string agentPT_Comm = 8;
  ExtraInfoModel extraInfo = 9;
  string platform = 10;
  string detailKey = 11;
}

message AgentViewRunningBetTicketModel {
  string no = 1;
  string transTime = 2;
  string choice = 3;
  string odds = 4;
  string stake = 5;
  string status = 6;
  string agentPT_Comm = 7;
  ExtraInfoModel extraInfo = 8;
  string platform = 9;
  string detailKey = 10;
}


message GetWinLossBetListRequest {
  string productGroup = 1;
  int32 custId = 2;
  string custName = 3;
  string fromDate = 4;
  string toDate = 5;
  string site = 6;
  int32 viewerId = 7;
  int32 roleId = 8;
  string productIds = 9;
} 

message SuperViewWinLossBetListResponse {
  repeated SuperViewWinLossBetTicketModel betLists = 1;
  WinLossTotalModelResponse total = 2;
}

message MasterViewWinLossBetListResponse {
  repeated MasterViewWinLossBetTicketModel betLists = 1;
  WinLossTotalModelResponse total = 2;
}

message AgentViewWinLossBetListResponse {
  repeated AgentViewWinLossBetTicketModel betLists = 1;
  WinLossTotalModelResponse total = 2;
}

message SuperViewWinLossBetTicketModel {
  string no = 1;
  string transTime = 2;
  string choice = 3;
  string odds = 4;
  string stake = 5;
  string winLoss = 6;
  string status = 7;
  string superPT_Comm = 8;
  string masterPT_Comm = 9;
  string agentPT_Comm = 10;
  ExtraInfoModel extraInfo = 11;
  string platform = 12;
  string detailKey = 13;
}

message MasterViewWinLossBetTicketModel {
  string no = 1;
  string transTime = 2;
  string choice = 3;
  string odds = 4;
  string stake = 5;
  string winLoss = 6;
  string status = 7;
  string masterPT_Comm = 8;
  string agentPT_Comm = 9;
  ExtraInfoModel extraInfo = 10;
  string platform = 11;
  string detailKey = 12;
}

message AgentViewWinLossBetTicketModel {
  string no = 1;
  string transTime = 2;
  string choice = 3;
  string odds = 4;
  string stake = 5;
  string winLoss = 6;
  string status = 7;
  string agentPT_Comm = 8;
  ExtraInfoModel extraInfo = 9;
  string platform = 10;
  string detailKey = 11;
}

message WinLossTotalModelResponse {
  string comm = 1;
  string winLoss = 2;
  string total = 3;
}

message GetTicketDetailsRequest {
  int64 refNo = 1;
  int32 custId = 2;
  optional int32 transType = 3;
  optional int32 productId = 4;
  optional string detailKey = 5;
}

message ExtraInfoModel {
  string refNo = 1;
  int32 transType = 2;
  int32 productId = 3;
}

message SuperViewTicketDetailsResponse {
  repeated SuperViewTicketDetailsModel ticketDetails = 1;
}

message MasterViewTicketDetailsResponse {
  repeated MasterViewTicketDetailsModel ticketDetails = 1;
}

message AgentViewTicketDetailsResponse {
  repeated AgentViewTicketDetailsModel ticketDetails = 1;
}

message GetParlaySelectionsRequest {
  string detailKey = 1;
  int64 refNo = 2;
}

message GetParlayDetailRequest {
  string detailKey = 1;
  int64 refNo = 2;
}

message ParlaySelectionsResponse {
  string selections = 1;
}

message ParlayDetailResponse {
  repeated ParlayDetailItem ParlayDetailItems = 1;
  string outstanding = 2;
  string total = 3;
}

message ParlayDetailItem{
  string date = 1;
  repeated ParlayEventModel events = 2;
  string subTotal = 3;
}

message ParlayEventModel {
  string event = 1;
  string odds = 2;
  string stake = 3;
  string winloss = 4;
  string status = 5;
}

message SuperViewTicketDetailsModel {
  string no = 1;
  string transTime = 2;
  string choice = 3;
  string odds = 4;
  string stake = 5;
  string winLoss = 6;
  string status = 7;
  string superPT_Comm = 8;
  string masterPT_Comm = 9;
  string agentPT_Comm = 10;
  string platform = 11;
}

message MasterViewTicketDetailsModel {
  string no = 1;
  string transTime = 2;
  string choice = 3;
  string odds = 4;
  string stake = 5;
  string winLoss = 6;
  string status = 7;
  string masterPT_Comm = 8;
  string agentPT_Comm = 9;
  string platform = 10;
}

message AgentViewTicketDetailsModel {
  string no = 1;
  string transTime = 2;
  string choice = 3;
  string odds = 4;
  string stake = 5;
  string winLoss = 6;
  string status = 7;
  string agentPT_Comm = 8;
  string platform = 9;
}