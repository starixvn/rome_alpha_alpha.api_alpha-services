syntax = "proto3";

option csharp_namespace = "GrpcCustomer";

package Customer;

service Customer {
    rpc GetCustomerInfo(GetCustomerInfoRequest) returns (GetCustomerInfoResponse) {}
    rpc GetBelongingInfo(GetBeLongingInfoRequest) returns (GetBeLongingInfoResponse) {}
    rpc GetAllProducts(GetAllProductsRequest) returns (GetAllProductsResponse) {}
    rpc ClearProductsCache(ClearProductsCacheRequest) returns (ClearProductsCacheResponse) {}
}

message GetCustomerInfoRequest {
    int32 custId = 1;
    string username = 2;
}

message GetCustomerInfoResponse {
    int32 custId = 1;
    int32 roleId = 2;
    string site = 3;
    int32 currency = 4;
}

message GetBeLongingInfoRequest {
    int32 viewerId = 1;
    int32 downlineId = 2;
    int32 subAccountId = 3;
    int64 transId = 4;
}

message GetBeLongingInfoResponse {
    bool isBelonging = 1;
}

message GetAllProductsRequest {
  int32 custId = 1;
  string siteName = 2;
  int32 currency = 3;
}

message GetAllProductsResponse {
  repeated ProductModel products = 1;
}

message ProductModel {
    int32 id = 1;
    string code = 2;
    string name = 3;
}

message ClearProductsCacheRequest {
    int32 custId = 1;
    string siteName = 2;
    int32 currency = 3;
}

message ClearProductsCacheResponse {
    bool result = 1;
}
