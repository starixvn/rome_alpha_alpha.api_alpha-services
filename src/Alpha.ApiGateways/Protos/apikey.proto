syntax = "proto3";

option csharp_namespace = "GrpcApiKeyClient";

package ApiKey;

service ApiKey {
    rpc VerifyApiKey(VerifyApiKeyRequest) returns (VerifyApiKeyResponse) {}
}

message VerifyApiKeyRequest {
    string key = 1;
    string passphrase = 2;
    string signature = 3;
    string timestamp = 4;
}

message VerifyApiKeyResponse {
    bool isAuthenticated = 1;
    int32 custId = 2;
    int32 roleId = 3;
    repeated string scopes = 4;
}